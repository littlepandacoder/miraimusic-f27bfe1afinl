<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Trainer — Musicable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
:root {
  --bg: #0a0812;
  --card: #151228;
  --card2: #1c1935;
  --ink: #e8ecf0;
  --sub: #a89bb5;
  --line: #2d2540;
  --rh: #00d4ff;
  --lh: #ff2d78;
  --accent: #5a45c4;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }

.container { display: flex; flex-direction: column; min-height: 100vh; }

/* Header */
.header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 8, 18, 0.95);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 24px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--rh), var(--lh));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-btn {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--sub);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
}

.nav-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Main */
.main {
  flex: 1;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 24px;
  overflow-y: auto;
}

/* Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}

.section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--sub);
  margin-bottom: 10px;
}

.btn-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.btn {
  padding: 8px 12px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--sub);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  transition: all 0.2s;
}

.btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  justify-content: center;
}

.btn-primary:hover {
  background: #6d55d4;
}

/* Content */
.content {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.visualizer-section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
}

.visualizer-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
}

.piano-wrapper {
  background: linear-gradient(135deg, rgba(10, 8, 18, 0.8), rgba(21, 18, 40, 0.8));
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 220px;
  overflow-x: auto;
}

canvas {
  max-width: 100%;
  border-radius: 6px;
}

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.play-btn {
  padding: 10px 16px;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  color: white;
  font-weight: 600;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}

.play-btn:hover {
  background: #6d55d4;
}

.tempo-control {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--sub);
}

.tempo-control input {
  width: 80px;
  cursor: pointer;
  accent-color: var(--accent);
}

.hand-selector {
  display: flex;
  gap: 6px;
  align-items: center;
}

.hand-btn {
  padding: 8px 12px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--sub);
  border-radius: 6px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  transition: all 0.2s;
}

.hand-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.hand-btn.active {
  background: var(--rh);
  border-color: var(--rh);
  color: white;
}

.hand-btn.active-lh {
  background: var(--lh);
  border-color: var(--lh);
  color: white;
}

.scales-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 300px;
  overflow-y: auto;
}

.scale-btn {
  padding: 10px 12px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--sub);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  transition: all 0.2s;
}

.scale-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.scale-btn.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.scale-info {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  font-size: 12px;
  line-height: 1.6;
}

.info-title {
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--rh);
}

.info-row {
  display: flex;
  gap: 8px;
  margin-bottom: 6px;
}

.info-label {
  font-weight: 600;
  color: var(--accent);
  min-width: 70px;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--sub);
}

@media (max-width: 1000px) {
  .main {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    max-height: none;
  }
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1 class="title">🎹 Scale Trainer</h1>
    <button class="nav-btn" onclick="window.location.href='/dashboard'">← Dashboard</button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="section">
        <div class="section-label">Grade Level</div>
        <div class="btn-group" id="gradeButtons"></div>
      </div>

      <div class="section">
        <div class="section-label">Set</div>
        <div class="btn-group" id="setButtons"></div>
      </div>

      <div class="section">
        <div class="section-label">Scales</div>
        <div class="scales-list" id="scalesList"></div>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="visualizer-section">
        <div class="visualizer-title" id="scaleTitle">Select a scale to begin</div>
        <div class="piano-wrapper">
          <canvas id="pianoCanvas"></canvas>
        </div>
        <div class="controls">
          <button class="play-btn" id="playBtn" onclick="playScale()">▶ Play Scale</button>
          <button class="play-btn" style="background: transparent; border: 1px solid var(--line); color: var(--sub);" onclick="resetView()">Reset</button>
          <div class="hand-selector">
            <span style="font-size: 11px; color: var(--sub); font-weight: 600;">Hand:</span>
            <button class="hand-btn active" onclick="setHandDisplay('both')" id="handBoth">Both</button>
            <button class="hand-btn" onclick="setHandDisplay('rh')" id="handRH">RH</button>
            <button class="hand-btn" onclick="setHandDisplay('lh')" id="handLH">LH</button>
          </div>
          <div class="tempo-control">
            <label>Speed:</label>
            <input type="range" id="tempoSlider" min="50" max="200" value="100">
          </div>
        </div>
      </div>

      <div class="scale-info" id="scaleInfo"></div>
    </div>
  </div>
</div>

let currentGrade = 'initial';
let currentSet = 'A';
let selectedScale = null;
let audioCtx = null;
let playing = false;
let handDisplay = 'both';
let playingNote = null;

function init() {
  renderGrades();
  renderSets();
  renderScales();
}

function renderGrades() {
  const html = Object.keys(GRADES).map(g => {
    const label = g === 'initial' ? 'Initial' : `Grade ${g}`;
    return `<button class="btn ${g === currentGrade ? 'active' : ''}" onclick="selectGrade('${g}')">${label}</button>`;
  }).join('');
  document.getElementById('gradeButtons').innerHTML = html;
}

function renderSets() {
  const sets = Object.keys(GRADES[currentGrade].sets);
  const html = sets.map(s => `<button class="btn ${s === currentSet ? 'active' : ''}" onclick="selectSet('${s}')">Set ${s}</button>`).join('');
  document.getElementById('setButtons').innerHTML = html;
}

function renderScales() {
  const scales = GRADES[currentGrade].sets[currentSet];
  const html = scales.map((s, i) => `<button class="scale-btn ${selectedScale?.scale === s.scale ? 'selected' : ''}" onclick="selectScale(${i})">${s.scale}</button>`).join('');
  document.getElementById('scalesList').innerHTML = html;

  if (!selectedScale && scales.length > 0) {
    selectScale(0);
  }
}

function selectGrade(grade) {
  currentGrade = grade;
  currentSet = 'A';
  selectedScale = null;
  renderGrades();
  renderSets();
  renderScales();
}

function selectSet(set) {
  currentSet = set;
  selectedScale = null;
  renderSets();
  renderScales();
}

function selectScale(idx) {
  const scales = GRADES[currentGrade].sets[currentSet];
  selectedScale = { ...scales[idx], hand: scales[idx].hand };
  renderScales();
  updateVisualizerAndInfo();
}

function updateVisualizerAndInfo() {
  if (!selectedScale) return;

  document.getElementById('scaleTitle').textContent = selectedScale.scale;

  const canvas = document.getElementById('pianoCanvas');
  const wrapper = document.querySelector('.piano-wrapper');
  canvas.width = 960;
  canvas.height = 180;
  const ctx = canvas.getContext('2d');
  drawPiano(ctx, selectedScale);

  const scaleKey = selectedScale.scale.replace(' (choice)', '').replace(' (harmonic)', '').replace(' (melodic)', '').replace(' (contrary motion)', '').replace(' (similar motion)', '').replace(/\(.*\)/g, '').trim();
  const scaleData = SCALE_NOTES[scaleKey] || { rh: [], lh: [], rhFinger: [], lhFinger: [] };

  const getNoteDisplay = (notes, fingers, hand) => {
    if (!notes || notes.length === 0) return '';
    return notes.map((midi, i) => `<span title="Finger ${fingers[i]}">${NOTE_NAMES[midi]}<sub>${fingers[i]}</sub></span>`).join(' - ');
  };

  const rhDisplay = getNoteDisplay(scaleData.rh, scaleData.rhFinger, 'RH');
  const lhDisplay = getNoteDisplay(scaleData.lh, scaleData.lhFinger, 'LH');

  const infoHtml = `
    <div class="info-title">${selectedScale.scale}</div>

      <span>${selectedScale.dynamics}</span>
    </div>

    </div>

    </div>

function drawPiano(ctx, scale, currentNote = null) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.fillStyle = '#0a0812';
  ctx.fillRect(0, 0, W, H);

  const lo = 48, hi = 84;
  const padding = 10;
  const startX = padding, startY = padding;
  const pianoW = W - padding * 2, pianoH = H - padding * 2;

  // Count white keys
  let whiteCount = 0;
  for (let m = lo; m <= hi; m++) if (![1,3,6,8,10].includes(m%12)) whiteCount++;

  const wkW = pianoW / whiteCount;
  const wkH = pianoH * 0.7;
  const bkW = wkW * 0.6;
  const bkH = pianoH * 0.45;

  // Get notes from SCALE_NOTES mapping
  const scaleKey = selectedScale.scale.replace(' (choice)', '').replace(' (harmonic)', '').replace(' (melodic)', '').replace(' (contrary motion)', '').replace(' (similar motion)', '').replace(/\(.*\)/g, '').trim();
  const scaleData = SCALE_NOTES[scaleKey] || { rh: [], lh: [], rhFinger: [], lhFinger: [] };

  // Get finger positions and determine which notes to show
  const fingerRH = {}, fingerLH = {};
  const notesToShow = new Set();

  // Build finger maps and show notes based on hand display
  if (scaleData.rh && scaleData.rh.length > 0) {
    scaleData.rh.forEach((m, i) => {
      fingerRH[m] = scaleData.rhFinger[i] || (i + 1);
      if (handDisplay === 'both' || handDisplay === 'rh') notesToShow.add(m);
    });
  }

  if (scaleData.lh && scaleData.lh.length > 0) {
    scaleData.lh.forEach((m, i) => {
      fingerLH[m] = scaleData.lhFinger[i] || (i + 1);
      if (handDisplay === 'both' || handDisplay === 'lh') notesToShow.add(m);
    });
  }

  // Map MIDI notes to white key indices
  const midiToWhiteIdx = {};
  let whiteIdx = 0;
  for (let m = lo; m <= hi; m++) {
    if (![1,3,6,8,10].includes(m%12)) {
      midiToWhiteIdx[m] = whiteIdx;
      whiteIdx++;
    }
  }

  // Draw white keys first
  let wi = 0;
  for (let m = lo; m <= hi; m++) {
    if ([1,3,6,8,10].includes(m%12)) continue;
    const x = startX + wi * wkW;
    const y = startY;
    const isActive = notesToShow.has(m);
    const isPlaying = currentNote === m;

    // Draw key - lighter if not in this hand, bright if playing
    if (isPlaying) {
      ctx.fillStyle = '#ffd700';
    } else if (!isActive) {
      ctx.fillStyle = '#e0e0e0';
    } else {
      ctx.fillStyle = '#f5f2ec';
    }

    ctx.strokeStyle = isPlaying ? '#ffaa00' : '#2d2540';
    ctx.lineWidth = isPlaying ? 3 : 1;
    ctx.fillRect(x, y, wkW, wkH);
    ctx.strokeRect(x, y, wkW, wkH);

    // Draw finger numbers only if in active hand
    if (isActive) {
      if (fingerRH[m]) {
        ctx.fillStyle = '#00d4ff';
        ctx.font = 'bold 12px -apple-system';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fingerRH[m], x + wkW / 2, y + wkH - 15);
      }
      if (fingerLH[m]) {
        ctx.fillStyle = '#ff2d78';
        ctx.font = 'bold 12px -apple-system';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fingerLH[m], x + wkW / 2, y + wkH - 35);
      }
    }

    wi++;
  }

  // Draw black keys positioned between white keys
  for (let m = lo; m < hi; m++) {
    if (![1,3,6,8,10].includes(m%12)) continue;

    // Find the white keys on either side of this black key
    let leftWhiteIdx = -1, rightWhiteIdx = -1;

    // C# is between C and D
    if ((m % 12) === 1) {
      leftWhiteIdx = midiToWhiteIdx[m - 1];
      rightWhiteIdx = midiToWhiteIdx[m + 1];
    }
    // D# is between D and E
    else if ((m % 12) === 3) {
      leftWhiteIdx = midiToWhiteIdx[m - 1];
      rightWhiteIdx = midiToWhiteIdx[m + 1];
    }
    // F# is between F and G
    else if ((m % 12) === 6) {
      leftWhiteIdx = midiToWhiteIdx[m - 1];
      rightWhiteIdx = midiToWhiteIdx[m + 1];
    }
    // G# is between G and A
    else if ((m % 12) === 8) {
      leftWhiteIdx = midiToWhiteIdx[m - 1];
      rightWhiteIdx = midiToWhiteIdx[m + 1];
    }
    // A# is between A and B
    else if ((m % 12) === 10) {
      leftWhiteIdx = midiToWhiteIdx[m - 1];
      rightWhiteIdx = midiToWhiteIdx[m + 1];
    }

    if (leftWhiteIdx !== -1 && rightWhiteIdx !== -1) {
      const leftX = startX + leftWhiteIdx * wkW;
      const rightX = startX + rightWhiteIdx * wkW;
      const x = leftX + (rightX - leftX) / 2 - bkW / 2;
      const y = startY;

      ctx.fillStyle = '#1a1620';
      ctx.strokeStyle = '#0a0812';
      ctx.lineWidth = 1;
      ctx.fillRect(x, y, bkW, bkH);
      ctx.strokeRect(x, y, bkW, bkH);
    }
  }
}

    });

  const highlightSet = new Set(notesToHighlight);

  const midiToWhiteIdx = {};
  let whiteIdx = 0;
  for (let m = lo; m <= hi; m++) {
    if (![1,3,6,8,10].includes(m%12)) {
      midiToWhiteIdx[m] = whiteIdx;
      whiteIdx++;
    }
  }

  // Draw white keys
  let wi = 0;
  for (let m = lo; m <= hi; m++) {
    if ([1,3,6,8,10].includes(m%12)) continue;
    const x = startX + wi * wkW;
    const y = startY;
    const isActive = notesToShow.has(m);
    const isPlaying = highlightSet.has(m);

    if (isPlaying) {
      ctx.fillStyle = '#ffd700';
    } else if (!isActive) {
      ctx.fillStyle = '#e0e0e0';
    } else {
      ctx.fillStyle = '#f5f2ec';
    }

    ctx.strokeStyle = isPlaying ? '#ffaa00' : '#2d2540';
    ctx.lineWidth = isPlaying ? 3 : 1;
    ctx.fillRect(x, y, wkW, wkH);
    ctx.strokeRect(x, y, wkW, wkH);

    if (isActive) {
      if (fingerRH[m]) {
        ctx.fillStyle = '#00d4ff';
        ctx.font = 'bold 12px -apple-system';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fingerRH[m], x + wkW / 2, y + wkH - 15);
      }
      if (fingerLH[m]) {
        ctx.fillStyle = '#ff2d78';
        ctx.font = 'bold 12px -apple-system';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fingerLH[m], x + wkW / 2, y + wkH - 35);
      }
    }

    wi++;
  }

  // Draw black keys
  const blackFrac = { 1: 0.68, 3: 1.72, 6: 3.65, 8: 4.63, 10: 5.65 };
  for (let m = lo; m < hi; m++) {
    if (![1,3,6,8,10].includes(m%12)) continue;
    const oct = Math.floor(m / 12), semis = m % 12;
    let wCountBefore = 0;
    for (let mm = lo; mm < oct * 12; mm++) if (![1,3,6,8,10].includes(mm%12)) wCountBefore++;
    const x = startX + (wCountBefore + blackFrac[semis]) * wkW - bkW / 2;
    const y = startY;
    const isPlaying = highlightSet.has(m);

    ctx.fillStyle = isPlaying ? '#ffd700' : '#1a1620';
    ctx.strokeStyle = isPlaying ? '#ffaa00' : '#0a0812';
    ctx.lineWidth = isPlaying ? 3 : 1;
    ctx.fillRect(x, y, bkW, bkH);
    ctx.strokeRect(x, y, bkW, bkH);
  }
}

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function playTone(freq, dur, gain) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(gain, now + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur / 1000);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur / 1000 + 0.02);
}

function playScale() {
  if (!selectedScale) { alert('Please select a scale first'); return; }
  if (playing) { playing = false; return; }
  playing = true;
  document.getElementById('playBtn').textContent = '⏹ Stop';

  const speed = Number(document.getElementById('tempoSlider').value) / 100;
  const tempo = parseInt(selectedScale.tempo);
  const stepMs = (60000 / tempo / speed);
  const gain = selectedScale.dynamics.includes('f') ? 0.2 : 0.1;
  const dur = selectedScale.articulation === 'staccato' ? stepMs * 0.4 : stepMs * 0.8;

  // Get notes from SCALE_NOTES mapping
  const scaleKey = selectedScale.scale.replace(' (choice)', '').replace(' (harmonic)', '').replace(' (melodic)', '').replace(' (contrary motion)', '').replace(' (similar motion)', '').replace(/\(.*\)/g, '').trim();
  const scaleData = SCALE_NOTES[scaleKey] || { rh: [], lh: [], rhFinger: [], lhFinger: [] };

  let notePairs = [];
  if (handDisplay === 'rh') {
    const rhNotes = (scaleData.rh || []).map(n => [n]);
    const rhReverse = [...rhNotes].reverse();
    notePairs = [...rhNotes, ...rhReverse.slice(1)]; // Don't repeat the top note
  } else if (handDisplay === 'lh') {
    const lhNotes = (scaleData.lh || []).map(n => [n]);
    const lhReverse = [...lhNotes].reverse();
    notePairs = [...lhNotes, ...lhReverse.slice(1)]; // Don't repeat the top note
  } else {
    // Both hands - play simultaneously in pairs, ascending then descending
    const maxLen = Math.max(scaleData.rh.length, scaleData.lh.length);
    const ascending = [];
    for (let j = 0; j < maxLen; j++) {
      const pair = [];
      if (j < scaleData.rh.length) pair.push(scaleData.rh[j]);
      if (j < scaleData.lh.length) pair.push(scaleData.lh[j]);
      ascending.push(pair);
    }
    const descending = [...ascending].reverse();
    notePairs = [...ascending, ...descending.slice(1)]; // Don't repeat the top pair
  }

  if (notePairs.length === 0) {
    playing = false;
    document.getElementById('playBtn').textContent = '▶ Play Scale';
    alert('No notes found for this scale');
    return;
  }

  let i = 0;
  const canvas = document.getElementById('pianoCanvas');
  const ctx = canvas.getContext('2d');

  const playNext = () => {
    if (!playing || i >= notePairs.length) {
      playing = false;
      playingNote = null;
      document.getElementById('playBtn').textContent = '▶ Play Scale';
      drawPiano(ctx, selectedScale);
      return;
    }

    const notesToPlay = notePairs[i];

    // Draw the piano with all highlighted notes for this step
    // For 'both', we need to show both notes at once
    if (handDisplay === 'both' && notesToPlay.length > 1) {
      // Create a visual that shows both notes - we'll draw the piano and highlight both
      drawPianoMultiple(ctx, selectedScale, notesToPlay);
    } else if (notesToPlay.length > 0) {
      drawPiano(ctx, selectedScale, notesToPlay[0]);
    }

    // Play all notes for this step simultaneously
    notesToPlay.forEach(note => {
      playTone(midiToFreq(note), dur, gain);
    });

    i++;
    setTimeout(playNext, stepMs);
  };

  playNext();
}

function resetView() {
  playing = false;
  playingNote = null;
  document.getElementById('playBtn').textContent = '▶ Play Scale';
  if (selectedScale) {
    const canvas = document.getElementById('pianoCanvas');
    const ctx = canvas.getContext('2d');
    drawPiano(ctx, selectedScale);
  }
}

function setHandDisplay(hand) {
  handDisplay = hand;
  document.getElementById('handBoth').classList.toggle('active', hand === 'both');
  document.getElementById('handBoth').classList.toggle('active-lh', false);
  document.getElementById('handRH').classList.toggle('active', hand === 'rh');
  document.getElementById('handRH').classList.toggle('active-lh', false);
  document.getElementById('handLH').classList.toggle('active', false);
  document.getElementById('handLH').classList.toggle('active-lh', hand === 'lh');

  if (selectedScale) {
    const canvas = document.getElementById('pianoCanvas');
    const ctx = canvas.getContext('2d');
    drawPiano(ctx, selectedScale);
  }
}

init();
</script>
