<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheet Music Library — Musicable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.2/dist/umd/supabase.js"></script>
    <style>
      :root {
        --bg: hsl(222 47% 11%);
        --card: hsl(222 47% 14%);
        --secondary: hsl(222 47% 18%);
        --border: hsl(222 47% 25%);
        --primary: hsl(330 85% 55%);
        --fg: #ffffff;
        --muted-fg: hsl(220 13% 70%);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Montserrat', sans-serif;
      }
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
        padding: 14px 4vw; background: var(--card); border-bottom: 1px solid var(--border);
      }
      .brand { font-weight: 900; font-size: 18px; }
      /* Piano Room vibes: rainbow, glowing "Musicable" with a twinkling sparkle. */
      .brand {
        position: relative;
        display: inline-block;
        background: linear-gradient(90deg, #ff3b6b, #ff9f1c, #ffe600, #2ed573, #1e90ff, #a55eea, #ff3b6b);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: brand-rainbow 4s linear infinite;
        filter: drop-shadow(0 0 6px rgba(236, 72, 153, 0.7)) drop-shadow(0 0 14px rgba(139, 92, 246, 0.5));
      }
      .brand span {
        color: transparent;
        background: inherit;
        -webkit-background-clip: text;
        background-clip: text;
      }
      .brand::after {
        content: "✦";
        position: absolute;
        top: -6px;
        right: -12px;
        font-size: 9px;
        color: #ffffff;
        text-shadow: 0 0 6px #ffffff, 0 0 12px #f0abfc;
        animation: brand-twinkle 1.6s ease-in-out infinite;
      }
      @keyframes brand-rainbow {
        to { background-position: 300% 50%; }
      }
      @keyframes brand-twinkle {
        0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
        50% { opacity: 1; transform: scale(1.15) rotate(45deg); }
      }
      .sub { color: var(--muted-fg); font-size: 13px; font-weight: 500; margin-left: 10px; }
      .back {
        color: var(--fg); text-decoration: none; font-weight: 600; font-size: 14px;
        border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; background: var(--secondary);
      }
      .back:hover { border-color: var(--primary); color: var(--primary); }
      main { padding: 24px 4vw 40px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      .intro { color: var(--muted-fg); font-size: 14px; margin: 0 0 22px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 18px;
      }
      .card {
        display: block; text-decoration: none; color: var(--fg);
        background: var(--card); border: 1px solid var(--border); border-radius: 16px;
        overflow: hidden; transition: border-color .2s, transform .2s;
      }
      .card:hover, .card:focus-visible { border-color: var(--primary); transform: translateY(-2px); outline: none; }
      .thumb {
        width: 100%; aspect-ratio: 3 / 4; background: #fbfbfd;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      .thumb img { width: 100%; height: 100%; object-fit: cover; }
      .thumb.placeholder { color: var(--muted-fg); font-size: 40px; background: var(--secondary); }
      .thumb.placeholder.named { font-size: 17px; font-weight: 700; line-height: 1.3; padding: 14px; text-align: center; color: var(--fg); overflow-wrap: anywhere; }
      .info { padding: 12px 14px 14px; }
      .title { font-weight: 700; font-size: 15px; line-height: 1.3; margin: 0; }
      .composer { color: var(--muted-fg); font-size: 12px; margin: 4px 0 0; }
      .back-link { display: inline-block; color: var(--primary); font-weight: 700; margin-bottom: 16px; text-decoration: none; }
      .state { color: var(--muted-fg); font-size: 15px; padding: 30px 0; }
      .section-title { font-size: 18px; font-weight: 800; margin: 26px 0 12px; }
      .section-title:first-child { margin-top: 0; }
      .state a { color: var(--primary); font-weight: 700; }
      .midi-bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px;
        border: 1px solid var(--border); background: var(--secondary); font-size: 13px; font-weight: 600;
      }
      .midi-bar .dot { width: 10px; height: 10px; border-radius: 50%; background: #6b7280; flex-shrink: 0; }
      .midi-bar .midi-text { flex: 1; min-width: 180px; }
      .midi-bar.on { border-color: #39d98a; background: rgba(57,217,138,.12); }
      .midi-bar.on .dot { background: #39d98a; box-shadow: 0 0 8px #39d98a; }
      .midi-bar.warn { border-color: #f59e0b; background: rgba(245,158,11,.12); }
      .midi-bar.warn .dot { background: #f59e0b; }
      .midi-bar .btn { padding: 6px 12px; font-size: 12px; }
      .card { cursor: pointer; }
      dialog.settings {
        background: var(--card); color: var(--fg); border: 1px solid var(--border); border-radius: 20px;
        padding: 0; width: min(460px, 92vw); box-shadow: 0 24px 60px rgba(0,0,0,.5);
      }
      dialog.settings::backdrop { background: rgba(10,15,28,.7); }
      .settings-head { padding: 20px 22px 6px; }
      .settings-head h2 { margin: 0; font-size: 18px; }
      .settings-head p { margin: 4px 0 0; color: var(--muted-fg); font-size: 14px; }
      .settings-body { padding: 14px 22px; display: grid; gap: 14px; }
      .settings-body label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted-fg); }
      .settings-body select, .settings-body input[type="number"] {
        font: inherit; color: var(--fg); background: var(--secondary); border: 1px solid var(--border);
        border-radius: 8px; padding: 9px 10px;
      }
      .group-title { font-size: 13px; font-weight: 600; color: var(--muted-fg); margin-bottom: 8px; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
      .tile {
        font: inherit; color: var(--fg); text-align: left; cursor: pointer;
        background: var(--secondary); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
        display: grid; gap: 4px; transition: border-color .15s, background .15s;
      }
      .tile:hover { border-color: var(--primary); }
      .tile .icon { font-size: 20px; line-height: 1; }
      .tile .label { font-size: 13px; font-weight: 700; }
      .tile .hint { font-size: 11px; color: var(--muted-fg); font-weight: 500; }
      .tile[aria-pressed="true"] { border-color: var(--primary); background: hsl(330 85% 55% / .18); }
      .tile[aria-pressed="true"] .hint { color: var(--fg); }
      .settings-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 6px 22px 20px; }
      .btn {
        font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--border); background: var(--secondary); color: var(--fg);
      }
      .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      .btn:hover { border-color: var(--primary); }
      @media (max-width: 480px) {
        .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      }

      /* ── Piano Room: lively, interactive library ── */
      .notes-bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
      .notes-bg span {
        position: absolute; bottom: -40px; font-size: 22px; opacity: 0;
        color: rgba(244, 114, 182, 0.55); text-shadow: 0 0 10px rgba(192, 132, 252, 0.6);
        animation: note-float linear infinite;
      }
      @keyframes note-float {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        15% { opacity: 0.9; }
        100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
      }
      body > *:not(.notes-bg) { position: relative; z-index: 1; }
      .topbar { position: relative; overflow: hidden; }
      .topbar::before {
        content: ""; position: absolute; inset: -40% -10%; pointer-events: none; opacity: 0.22;
        background: linear-gradient(100deg, transparent 20%, #ff3b6b 35%, #ffe600 45%, #2ed573 55%, #1e90ff 65%, #a55eea 75%, transparent 85%);
        animation: band-sweep 8s ease-in-out infinite;
      }
      @keyframes band-sweep { 0%, 100% { transform: translateX(-12%); } 50% { transform: translateX(12%); } }
      .card { transform-style: preserve-3d; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; will-change: transform; }
      .card:hover, .card:focus-visible {
        box-shadow: 0 0 0 1px rgba(244, 114, 182, 0.6), 0 0 26px 4px rgba(192, 132, 252, 0.45), 0 0 46px 10px rgba(253, 230, 138, 0.18);
      }
      .section-title {
        background: linear-gradient(90deg, #f472b6, #c084fc, #fde68a, #f472b6);
        background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: brand-rainbow 6s linear infinite; display: inline-block; position: relative;
      }
      .section-title::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px; border-radius: 3px;
        background: linear-gradient(90deg, #f472b6, #c084fc, #fde68a); box-shadow: 0 0 10px rgba(244, 114, 182, 0.7);
      }
      .burst-spark {
        position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 50;
        background: radial-gradient(circle, #ffffff, #f0abfc 40%, transparent 70%);
        box-shadow: 0 0 8px #f0abfc; animation: burst-fly 0.8s ease-out forwards;
      }
      @keyframes burst-fly {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .notes-bg, .topbar::before, .section-title, .brand, .card, .burst-spark { animation: none !important; transition: none !important; }
      }
      /* Song cards as vinyl records: the cover is the label on a grooved disc that spins on hover. */
      .card { background: transparent; border: none; overflow: visible; text-align: center; padding: 8px 4px 4px; }
      .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: none; border: none; }
      .thumb {
        width: 100%; aspect-ratio: 1 / 1; border-radius: 50%; position: relative; overflow: hidden;
        background:
          repeating-radial-gradient(circle, #0b0f1a 0 2px, #1f2937 3px 4px),
          #111827;
        box-shadow: 0 0 0 4px #0b0f1a, 0 12px 26px rgba(0, 0, 0, 0.45), 0 0 18px rgba(192, 132, 252, 0.25);
        transition: box-shadow .3s;
      }
      .thumb::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; z-index: 1;
        background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.2) 50%, transparent 62%);
      }
      .thumb::before {
        content: ""; position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
        border-radius: 50%; background: #0b0f1a; z-index: 3;
      }
      .thumb img {
        position: absolute; top: 50%; left: 50%; width: 56%; height: 56%; transform: translate(-50%, -50%);
        border-radius: 50%; object-fit: cover; z-index: 2; box-shadow: 0 0 0 2px #0b0f1a;
      }
      .thumb.placeholder {
        background: repeating-radial-gradient(circle, #0b0f1a 0 2px, #1f2937 3px 4px), #111827;
        color: var(--fg); font-size: 14px;
      }
      .thumb.placeholder.named { padding: 0; }
      .thumb.placeholder.named::after { z-index: 1; }
      .thumb.placeholder.named > span, .thumb.placeholder.named { display: flex; align-items: center; justify-content: center; }
      .card:hover .thumb { animation: vinyl-spin 3.5s linear infinite; box-shadow: 0 0 0 4px #0b0f1a, 0 14px 30px rgba(0,0,0,.5), 0 0 26px 6px rgba(244,114,182,.45), 0 0 46px 12px rgba(253,230,138,.18); }
      .info { padding: 12px 6px 0; }
      .title { font-size: 14px; }
      .composer { font-size: 11px; }
      @keyframes vinyl-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .card:hover .thumb { animation: none; } }
      /* Category carousel: album covers with a vinyl peeking out, swipeable and centred. */
      .carousel { position: relative; margin: 0 -16px; }
      .carousel-track {
        display: flex; gap: 22px; overflow-x: auto; scroll-snap-type: x mandatory;
        padding: 26px calc(50% - 125px) 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        cursor: grab; user-select: none; touch-action: pan-x pan-y;
      }
      .carousel-track::-webkit-scrollbar { display: none; }
      .carousel-track.dragging { cursor: grabbing; scroll-snap-type: none; }
      .album {
        position: relative; flex: 0 0 250px; scroll-snap-align: center; transition: transform .3s ease, opacity .3s ease;
        transform-origin: center center;
      }
      .album::before {
        content: ""; position: absolute; top: 14px; right: -46px; width: 230px; height: 230px; border-radius: 50%;
        background: repeating-radial-gradient(circle, #0b0f1a 0 2px, #1f2937 3px 4px), #111827;
        box-shadow: 0 0 0 3px #0b0f1a, 0 10px 24px rgba(0,0,0,.5); z-index: 0;
      }
      .album .thumb {
        position: relative; z-index: 1; width: 100%; aspect-ratio: 1 / 1; border-radius: 12px;
        background: #111827; box-shadow: 0 16px 34px rgba(0,0,0,.55), 0 0 26px rgba(244,114,182,.3);
      }
      .album .thumb img { border-radius: 12px; width: 100%; height: 100%; }
      .album .thumb.placeholder.named { font-size: 22px; }
      .album .info { text-align: center; padding: 14px 4px 0; }
      .album .title { font-size: 17px; }
      .album .composer { font-size: 13px; }
      .carousel-arrow {
        position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 44px; height: 44px; border-radius: 50%;
        border: 1px solid rgba(244,114,182,.5); background: rgba(15,23,42,.8); color: #fff; font-size: 26px; line-height: 1;
        cursor: pointer; box-shadow: 0 0 14px rgba(244,114,182,.35);
      }
      .carousel-arrow.prev { left: 8px; }
      .carousel-arrow.next { right: 8px; }
      .carousel-arrow:hover { background: rgba(244,114,182,.25); }
      .carousel-hint { text-align: center; color: var(--muted-fg); font-size: 13px; margin: 6px 0 0; }
      @media (max-width: 600px) { .carousel-arrow { display: none; } .album { flex-basis: 200px; } .album::before { width: 186px; height: 186px; right: -34px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/alphaTab.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
  </head>
  <body>
    <div class="notes-bg" aria-hidden="true"></div>
    <div id="previewHost" aria-hidden="true" style="position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none"></div>
    <header class="topbar">
      <div><span class="brand">Musicable<span>.</span></span><span class="sub">Sheet Music Library</span></div>
      <a class="back" href="/dashboard">&larr; Back to dashboard</a>
    </header>
    <main>
      <h1>Choose a piece</h1>
      <p id="intro" class="intro">Tap a picture to open the sheet music and practise it.</p>
      <div id="state" class="state">Loading library…</div>
      <div id="sections"></div>
    </main>

    <dialog id="settings" class="settings">
      <form method="dialog" id="settingsForm">
        <div class="settings-head">
          <h2 id="settingsTitle">Practice settings</h2>
          <p>Choose how you want to practise, then start.</p>
        </div>
        <div class="settings-body">
          <div id="midiBar" class="midi-bar">
            <span class="dot"></span>
            <span id="midiText" class="midi-text">Checking MIDI…</span>
            <button type="button" class="btn" id="midiCheckBtn" hidden>Check now</button>
          </div>
          <div>
            <div class="group-title">Note input</div>
            <div class="tiles">
              <button type="button" class="tile" data-toggle="require"><span class="icon">🎹</span><span class="label">Require note input</span><span class="hint">Wait until the right note is played</span></button>
            </div>
          </div>
          <div>
            <div class="group-title">Practice mode</div>
            <div class="tiles" data-group="mode">
              <button type="button" class="tile" data-value="wait"><span class="icon">⏸</span><span class="label">Wait for note</span><span class="hint">Stops at each note</span></button>
              <button type="button" class="tile" data-value="sync"><span class="icon">▶️</span><span class="label">Sync performance</span><span class="hint">Plays on, results at the end</span></button>
              <button type="button" class="tile" data-value="play"><span class="icon">🔊</span><span class="label">Just play</span><span class="hint">Plays the score, no checks or results</span></button>
            </div>
          </div>
          <div>
            <div class="group-title">Checkpoints</div>
            <div class="tiles" data-group="checkpoints">
              <button type="button" class="tile" data-value="note"><span class="icon">♩</span><span class="label">Every note</span></button>
              <button type="button" class="tile" data-value="measure"><span class="icon">𝄀</span><span class="label">Every measure</span></button>
            </div>
          </div>
          <div>
            <div class="group-title">Clef</div>
            <div class="tiles" data-group="clef">
              <button type="button" class="tile" data-value="both"><span class="icon">𝄞 𝄢</span><span class="label">Treble + bass</span></button>
              <button type="button" class="tile" data-value="treble"><span class="icon">𝄞</span><span class="label">Treble only</span></button>
              <button type="button" class="tile" data-value="bass"><span class="icon">𝄢</span><span class="label">Bass only</span></button>
            </div>
          </div>
          <label class="group-title" style="display:grid;gap:6px">Chord window (ms)
            <input id="setChord" type="number" min="50" max="1000" step="10" value="250" style="font:inherit;color:var(--fg);background:var(--secondary);border:1px solid var(--border);border-radius:8px;padding:9px 10px" />
          </label>
        </div>
        <div class="settings-foot">
          <button type="button" class="btn" id="settingsCancel">Cancel</button>
          <button type="submit" class="btn primary" id="settingsStart">Start practice</button>
        </div>
      </form>
    </dialog>

    <script>
      // Same signed-in session as the website (localStorage is shared on the same origin).
      const SUPABASE_URL = "https://tychkyunjfbkksyxknhn.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5Y2hreXVuamZia2tzeXhrbmhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0NDQxOTEsImV4cCI6MjA4NDAyMDE5MX0.5NzAwo1xGI3rOIihsEuBJKfYxAWMpBO60MjI2jUR7Qw";
      const THUMB_BUCKET = "sheet-music-thumbs";
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true },
      });

      const stateEl = document.getElementById("state");
      const sections = document.getElementById("sections");


      const showState = (html) => {
        stateEl.innerHTML = html;
        stateEl.hidden = !html;
      };

      // Settings pop-up: the choices are passed to the practice page in the link.
      const settingsDialog = document.getElementById("settings");
      let chosenSong = null;

      // Tile choices. null = nothing selected in that group, so the default is used.
      const DEFAULTS = { mode: "wait", checkpoints: "note", clef: "both" };
      const choice = { mode: null, checkpoints: null, clef: null, require: true };

      function refreshOptions() {
        document.querySelectorAll("[data-group]").forEach((group) => {
          const key = group.dataset.group;
          group.querySelectorAll("button[data-value]").forEach((btn) => {
            btn.setAttribute("aria-pressed", String(choice[key] === btn.dataset.value));
          });
        });
        document.querySelectorAll("[data-toggle='require']").forEach((btn) => {
          btn.setAttribute("aria-pressed", String(choice.require));
        });
      }

      document.querySelectorAll("[data-group] button[data-value]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.parentElement.dataset.group;
          choice[key] = choice[key] === btn.dataset.value ? null : btn.dataset.value;
          refreshOptions();
        });
      });
      document.querySelector("[data-toggle='require']").addEventListener("click", () => {
        choice.require = !choice.require;
        refreshOptions();
      });

      // MIDI keyboard detection: shown in the pop-up before the practice page opens.
      const midiBar = document.getElementById("midiBar");
      const midiText = document.getElementById("midiText");
      const midiCheckBtn = document.getElementById("midiCheckBtn");
      let midiAccess = null;

      function setMidiBar(state, message) {
        midiBar.className = `midi-bar ${state}`;
        midiText.textContent = message;
      }

      function renderMidi() {
        if (!navigator.requestMIDIAccess) {
          setMidiBar("warn", "This browser cannot detect MIDI keyboards. Use Chrome, Edge or Opera.");
          return;
        }
        if (!midiAccess) {
          setMidiBar("warn", "MIDI keyboard not checked yet. Press Check now.");
          return;
        }
        const inputs = [...midiAccess.inputs.values()];
        if (inputs.length === 0) {
          setMidiBar("warn", "No MIDI keyboard detected. Plug it in and switch it on.");
        } else {
          setMidiBar("on", `MIDI keyboard detected: ${inputs.map((input) => input.name || input.id).join(", ")}`);
        }
      }

      // Asks the browser for MIDI access. The browser's permission prompt only appears here.
      async function checkMidi() {
        if (!navigator.requestMIDIAccess) {
          renderMidi();
          return;
        }
        try {
          midiAccess = await navigator.requestMIDIAccess({ sysex: false });
          midiAccess.onstatechange = renderMidi; // updates when a keyboard is plugged in or removed
          midiCheckBtn.hidden = true;
        } catch (e) {
          midiCheckBtn.hidden = false;
          setMidiBar("warn", `MIDI access was denied or is unavailable: ${e?.message ?? e}`);
          return;
        }
        renderMidi();
      }

      // Checks silently only if MIDI permission was already given; otherwise the user presses Check now.
      async function autoCheckMidi() {
        let granted = false;
        try {
          const status = await navigator.permissions.query({ name: "midi", sysex: false });
          granted = status.state === "granted";
        } catch (_) {
          granted = false;
        }
        if (granted) {
          checkMidi();
        } else {
          midiCheckBtn.hidden = false;
          renderMidi();
        }
      }

      midiCheckBtn.onclick = checkMidi;

      function openSettings(song) {
        chosenSong = song;
        refreshOptions();
        autoCheckMidi();
        document.getElementById("settingsTitle").textContent = song.title;
        settingsDialog.showModal();
      }

      document.getElementById("settingsCancel").onclick = () => settingsDialog.close();

      document.getElementById("settingsForm").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!chosenSong) return;
        const params = new URLSearchParams({
          song: `lib-${chosenSong.id}`,
          mode: choice.mode ?? DEFAULTS.mode,
          checkpoints: choice.checkpoints ?? DEFAULTS.checkpoints,
          clef: choice.clef ?? DEFAULTS.clef,
          chord: document.getElementById("setChord").value || "250",
          require: choice.require ? "1" : "0",
        });
        window.location.href = `index.html?${params.toString()}`;
      });

      function makeCard(song, thumbUrl) {
        const card = document.createElement("a");
        card.dataset.songId = song.id;
        card._song = song;
        card.className = "card";
        card.href = `index.html?song=${encodeURIComponent(`lib-${song.id}`)}`;
        card.addEventListener("click", (event) => {
          event.preventDefault();
          openSettings(song);
        });

        const thumb = document.createElement("div");
        if (thumbUrl) {
          thumb.className = "thumb";
          const img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.src = thumbUrl;
          thumb.appendChild(img);
        } else {
          thumb.className = "thumb placeholder named";
          thumb.textContent = song.title;
        }

        const info = document.createElement("div");
        info.className = "info";
        const title = document.createElement("p");
        title.className = "title";
        title.textContent = song.title;
        info.appendChild(title);
        if (song.composer) {
          const composer = document.createElement("p");
          composer.className = "composer";
          composer.textContent = song.composer;
          info.appendChild(composer);
        }

        card.append(thumb, info);
        return card;
      }

      const intro = document.getElementById("intro");
      let categories = [];
      let songs = [];
      let songUrls = {};
      let categoryUrls = {};

      // A tile for a category (or a song): picture, title, subtitle. Tapping it goes to the hash link.
      function makeTile(title, subtitle, thumbUrl, hash) {
        const tile = document.createElement("a");
        tile.className = "card";
        tile.href = hash;
        const thumb = document.createElement("div");
        if (thumbUrl) {
          thumb.className = "thumb";
          const img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.src = thumbUrl;
          thumb.appendChild(img);
        } else {
          thumb.className = "thumb placeholder named";
          thumb.textContent = title;
        }
        const info = document.createElement("div");
        info.className = "info";
        const titleEl = document.createElement("p");
        titleEl.className = "title";
        titleEl.textContent = title;
        info.appendChild(titleEl);
        if (subtitle) {
          const sub = document.createElement("p");
          sub.className = "composer";
          sub.textContent = subtitle;
          info.appendChild(sub);
        }
        tile.append(thumb, info);
        return tile;
      }

      // Songs that belong to no category are shown under "Other".
      const categoryIds = () => new Set(categories.map((c) => c.id));
      const songsIn = (id) => (id === "other"
        ? songs.filter((s) => !categoryIds().has(s.category_id))
        : songs.filter((s) => s.category_id === id));

      function renderCategories() {
        intro.textContent = "Tap a category to see its songs.";
        sections.innerHTML = "";
        const groups = categories.map((c) => ({ id: c.id, name: c.name }));
        if (songsIn("other").length > 0) groups.push({ id: "other", name: "Other" });
        // Categories are album covers in a swipeable carousel, centred on screen.
        const carousel = document.createElement("div");
        carousel.className = "carousel";
        const prev = document.createElement("button");
        prev.type = "button";
        prev.className = "carousel-arrow prev";
        prev.setAttribute("aria-label", "Previous category");
        prev.textContent = "‹";
        const next = document.createElement("button");
        next.type = "button";
        next.className = "carousel-arrow next";
        next.setAttribute("aria-label", "Next category");
        next.textContent = "›";
        const track = document.createElement("div");
        track.className = "carousel-track";
        for (const group of groups) {
          const inside = songsIn(group.id);
          const firstWithPicture = inside.find((s) => songUrls[s.id]);
          const picture = categoryUrls[group.id] || (firstWithPicture ? songUrls[firstWithPicture.id] : null);
          const count = `${inside.length} song${inside.length === 1 ? "" : "s"}`;
          const tile = makeTile(group.name, count, picture, `#cat=${group.id}`);
          tile.classList.add("album");
          track.appendChild(tile);
        }
        carousel.append(prev, track, next);
        sections.appendChild(carousel);
        const hint = document.createElement("p");
        hint.className = "carousel-hint";
        hint.textContent = "Swipe to explore";
        sections.appendChild(hint);
        setupCarousel(track, prev, next);
      }

      // Swipe (touch), drag (mouse) or arrows. The centred album grows; the others shrink and fade.
      function setupCarousel(track, prev, next) {
        const albums = () => [...track.querySelectorAll(".album")];
        const updateFocus = () => {
          const mid = track.getBoundingClientRect().left + track.clientWidth / 2;
          for (const el of albums()) {
            const r = el.getBoundingClientRect();
            const d = Math.abs(r.left + r.width / 2 - mid) / (track.clientWidth / 2);
            const k = Math.max(0, 1 - Math.min(d, 1));
            el.style.transform = `scale(${(0.82 + 0.18 * k).toFixed(3)})`;
            el.style.opacity = (0.45 + 0.55 * k).toFixed(3);
          }
        };
        track.addEventListener("scroll", () => requestAnimationFrame(updateFocus), { passive: true });
        window.addEventListener("resize", updateFocus);
        prev.onclick = () => track.scrollBy({ left: -280, behavior: "smooth" });
        next.onclick = () => track.scrollBy({ left: 280, behavior: "smooth" });
        // Mouse drag to scroll. A drag never counts as a click on the album.
        let dragging = false, startX = 0, startLeft = 0, moved = 0;
        track.addEventListener("pointerdown", (e) => {
          if (e.pointerType !== "mouse") return;
          dragging = true; startX = e.clientX; startLeft = track.scrollLeft; moved = 0;
          track.classList.add("dragging");
        });
        window.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          moved = Math.max(moved, Math.abs(e.clientX - startX));
          track.scrollLeft = startLeft - (e.clientX - startX);
        });
        window.addEventListener("pointerup", () => {
          if (!dragging) return;
          dragging = false;
          track.classList.remove("dragging");
        });
        track.addEventListener("click", (e) => { if (moved > 6) { e.preventDefault(); e.stopPropagation(); } }, true);
        // Start with the first album centred.
        requestAnimationFrame(() => { updateFocus(); });
      }

      function renderCategorySongs(id) {
        const name = id === "other" ? "Other" : (categories.find((c) => c.id === id)?.name ?? null);
        if (name === null) {
          location.hash = "";
          return;
        }
        intro.textContent = name;
        sections.innerHTML = "";
        const back = document.createElement("a");
        back.className = "back-link";
        back.href = "#";
        back.textContent = "← All categories";
        sections.appendChild(back);
        const inside = songsIn(id);
        const grid = document.createElement("div");
        grid.className = "grid";
        if (inside.length === 0) {
          showState("No songs in this category yet.");
        } else {
          showState("");
          inside.forEach((song) => grid.appendChild(makeCard(song, songUrls[song.id])));
        }
        sections.appendChild(grid);
      }

      function renderView() {
        const match = location.hash.match(/cat=([^&]+)/);
        if (match) renderCategorySongs(decodeURIComponent(match[1]));
        else renderCategories();
      }

      async function load() {
        try {
          const { data: sessionData } = await sb.auth.getSession();
          if (!sessionData.session) {
            showState('Sign in to see the sheet music library. <a href="/login">Sign in</a>');
            return;
          }

          const { data: categoryRows, error: categoryError } = await sb
            .from("sheet_music_categories")
            .select("id, name, sort_order, thumbnail_path")
            .order("sort_order")
            .order("name");
          if (categoryError) throw categoryError;
          categories = categoryRows || [];

          const { data, error } = await sb
            .from("sheet_music_library")
            .select("id, title, composer, storage_path, thumbnail_path, category_id, created_at")
            .order("created_at", { ascending: false });
          if (error) throw error;
          songs = data || [];

          // Private thumbnails: short-lived signed links for songs and categories.
          const sign = (path) => sb.storage.from(THUMB_BUCKET).createSignedUrl(path, 3600).then(({ data: signed }) => (signed ? signed.signedUrl : null));
          const songLinks = await Promise.all(songs.map((song) => (song.thumbnail_path ? sign(song.thumbnail_path) : null)));
          const categoryLinks = await Promise.all(categories.map((c) => (c.thumbnail_path ? sign(c.thumbnail_path) : null)));
          songUrls = Object.fromEntries(songs.map((song, i) => [song.id, songLinks[i]]));
          categoryUrls = Object.fromEntries(categories.map((c, i) => [c.id, categoryLinks[i]]));

          if (songs.length === 0 && categories.length === 0) {
            showState("No sheet music in the library yet.");
            return;
          }
          showState("");
          window.addEventListener("hashchange", renderView);
          renderView();
        } catch (e) {
          showState(`Could not load the library: ${e.message ?? e}`);
        }
      }

      load();
    </script>
    <script>
      // Floating notes in the background.
      (function () {
        const bg = document.querySelector('.notes-bg');
        if (!bg || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const notes = ['♪', '♫', '♬', '♩'];
        for (let i = 0; i < 14; i++) {
          const n = document.createElement('span');
          n.textContent = notes[i % notes.length];
          n.style.left = Math.round(Math.random() * 96) + '%';
          n.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
          n.style.animationDelay = (-Math.random() * 14).toFixed(1) + 's';
          n.style.fontSize = (16 + Math.random() * 22).toFixed(0) + 'px';
          bg.appendChild(n);
        }
      })();

      // Cards tilt toward the pointer.
      (function () {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        let current = null;
        document.addEventListener('pointermove', (e) => {
          const card = e.target.closest && e.target.closest('.card');
          if (current && current !== card) { current.style.transform = ''; current = null; }
          if (!card || e.pointerType === 'touch') return;
          const r = card.getBoundingClientRect();
          const px = (e.clientX - r.left) / r.width - 0.5;
          const py = (e.clientY - r.top) / r.height - 0.5;
          card.style.transform = `perspective(700px) rotateX(${(-py * 8).toFixed(2)}deg) rotateY(${(px * 8).toFixed(2)}deg) translateY(-3px)`;
          current = card;
        });
        document.addEventListener('pointerleave', () => { if (current) { current.style.transform = ''; current = null; } });
      })();

      // Sparkle burst where a card is pressed.
      document.addEventListener('pointerdown', (e) => {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (!e.target.closest || !e.target.closest('.card')) return;
        for (let i = 0; i < 10; i++) {
          const s = document.createElement('span');
          s.className = 'burst-spark';
          const angle = (Math.PI * 2 * i) / 10;
          const dist = 36 + Math.random() * 30;
          s.style.left = e.clientX - 4 + 'px';
          s.style.top = e.clientY - 4 + 'px';
          s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
          s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 900);
        }
      });
    </script>
    <script type="module">
      // The same Salamander Grand Piano sampler the Music Sheet page plays the score with.
      import { startKeySound, stopKeySound, silencePiano } from "/sheet-music-practice/src/keySampler.js";
      window.pianoSound = { startKeySound, stopKeySound, silencePiano };
    </script>
    <script>
      // Hover a record to hear a 15-second preview. One shared player, so starting a new preview stops the last one.
      (function () {
        const host = document.getElementById("previewHost");
        let api = null;
        let activeId = null;
        let hoverTimer = null;
        let stopTimer = null;

        const ensurePlayer = () => {
          if (api) return api;
          api = new alphaTab.AlphaTabApi(host, {
            core: { useWorkers: false },
            player: {
              enablePlayer: true,
              scrollMode: 0, // Off: the preview must never scroll the page while it plays
              soundFont: "https://cdn.jsdelivr.net/npm/@coderline/alphatab@latest/dist/soundfont/sonivox.sf2",
            },
          });
          api.masterVolume = 0; // alphaTab's built-in synth stays silent; the piano sampler makes the sound
          api.midiEventsPlayedFilter = [alphaTab.midi.MidiEventType.NoteOn, alphaTab.midi.MidiEventType.NoteOff];
          api.midiEventsPlayed.on(playPreviewNotes);
          api.playerReady.on(() => { if (activeId) api.play(); });
          api.scoreLoaded.on(() => { if (activeId) api.play(); });
          return api;
        };

        // Browsers only allow sound after a click on the page. Create the player on the first click or tap, so
        // previews that start on hover can be heard.
        document.addEventListener("pointerdown", () => ensurePlayer(), { once: true, capture: true });

        // Piano voices still sounding, per track and pitch, so each note-off releases the right one.
        const voices = new Map();
        let serial = 0;
        const playPreviewNotes = (e) => {
          const piano = window.pianoSound;
          if (!piano) return;
          for (const event of e.events) {
            const isOn = event.command === alphaTab.midi.MidiEventType.NoteOn && event.noteVelocity > 0;
            const isOff = event.command === alphaTab.midi.MidiEventType.NoteOff
              || (event.command === alphaTab.midi.MidiEventType.NoteOn && event.noteVelocity === 0);
            if (!isOn && !isOff) continue;
            if (api.score && api.score.tracks[event.track] && api.score.tracks[event.track].isPercussion) continue;
            const key = `${event.track}-${event.noteKey}`;
            if (isOn) {
              const id = `preview-${++serial}`;
              if (!voices.has(key)) voices.set(key, []);
              voices.get(key).push(id);
              piano.startKeySound(event.noteKey, event.noteVelocity, id);
            } else {
              const queue = voices.get(key);
              if (queue && queue.length) piano.stopKeySound(event.noteKey, queue.shift());
            }
          }
        };

        const stopPreview = () => {
          clearTimeout(hoverTimer);
          clearTimeout(stopTimer);
          activeId = null;
          voices.clear();
          if (window.pianoSound) window.pianoSound.silencePiano();
          if (api) api.stop();
        };

        const startPreview = async (song) => {
          if (!song || !song.storage_path || typeof sb === "undefined") return;
          activeId = song.id;
          const { data, error } = await sb.storage.from("sheet-music-library").download(song.storage_path);
          if (error || !data || activeId !== song.id) return;
          const bytes = new Uint8Array(await data.arrayBuffer());
          if (activeId !== song.id) return;
          ensurePlayer().load(bytes);
          clearTimeout(stopTimer);
          stopTimer = setTimeout(stopPreview, 15000);
        };

        document.addEventListener("pointerover", (e) => {
          if (e.pointerType !== "mouse") return; // touch taps open the song instead
          const card = e.target.closest && e.target.closest(".card[data-song-id]");
          if (!card || card.dataset.songId === activeId) return;
          clearTimeout(hoverTimer);
          hoverTimer = setTimeout(() => startPreview(card._song), 350);
        });

        document.addEventListener("pointerout", (e) => {
          if (e.pointerType !== "mouse") return;
          const card = e.target.closest && e.target.closest(".card[data-song-id]");
          if (!card) return;
          const next = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".card[data-song-id]");
          if (next === card) return;
          stopPreview();
        });

        window.addEventListener("pagehide", stopPreview);
      })();
    </script>
