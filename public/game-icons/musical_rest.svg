<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="#151228"/>
  <!-- Staff lines -->
  <line x1="10" y1="28" x2="90" y2="28" stroke="#3a3760" stroke-width="2"/>
  <line x1="10" y1="39" x2="90" y2="39" stroke="#3a3760" stroke-width="2"/>
  <line x1="10" y1="50" x2="90" y2="50" stroke="#3a3760" stroke-width="2"/>
  <line x1="10" y1="61" x2="90" y2="61" stroke="#3a3760" stroke-width="2"/>
  <line x1="10" y1="72" x2="90" y2="72" stroke="#3a3760" stroke-width="2"/>
  <!-- Semibreve rest (pink) — hangs below 2nd line from top -->
  <rect x="14" y="39" width="24" height="8" rx="1" fill="#FF2D78"/>
  <!-- Minim rest (sky) — sits on middle line -->
  <rect x="42" y="42" width="24" height="8" rx="1" fill="#00D4FF"/>
  <!-- Crotchet rest (purple) — zigzag -->
  <path d="M78 32 L70 44 C80 48 80 54 72 57 C64 60 66 68 74 72" stroke="#A855F7" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Label -->
  <text x="50" y="92" font-family="'Orbitron',monospace" font-size="7.5" font-weight="700" fill="#6B7280" text-anchor="middle" letter-spacing="0.5">RESTS</text>
</svg>
