<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#071a1a"/>
      <stop offset="100%" stop-color="#030b0d"/>
    </radialGradient>
    <filter id="glow-t">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect width="200" height="200" rx="20" fill="none" stroke="rgba(20,184,166,0.25)" stroke-width="1.5"/>

  <!-- Staff lines (musical scale symbol) -->
  <g opacity="0.18" stroke="#14b8a6" stroke-width="1">
    <line x1="14" y1="60" x2="90" y2="60"/>
    <line x1="14" y1="68" x2="90" y2="68"/>
    <line x1="14" y1="76" x2="90" y2="76"/>
    <line x1="14" y1="84" x2="90" y2="84"/>
    <line x1="14" y1="92" x2="90" y2="92"/>
  </g>

  <!-- Scale ascending notes on staff -->
  <g filter="url(#glow-t)">
    <circle cx="22" cy="94" r="5" fill="#14b8a6" opacity="0.9"/>
    <circle cx="34" cy="88" r="5" fill="#14b8a6" opacity="0.9"/>
    <circle cx="46" cy="84" r="5" fill="#14b8a6" opacity="0.9"/>
    <circle cx="58" cy="78" r="5" fill="#67e8f9" opacity="0.95"/>
    <circle cx="70" cy="72" r="5" fill="#67e8f9" opacity="0.95"/>
    <circle cx="82" cy="66" r="5.5" fill="#a5f3fc" opacity="1"/>
    <!-- Arrow up -->
    <path d="M87 55 L95 44 L103 55" stroke="#a5f3fc" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <line x1="95" y1="44" x2="95" y2="68" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Dragon boss (right side) -->
  <g transform="translate(108, 28)">
    <!-- Body -->
    <path d="M4 80 Q8 55 12 42 Q17 28 32 20 Q47 28 52 42 Q56 55 60 80Z" fill="#0e7490"/>
    <path d="M4 80 Q2 56 0 42 Q-2 28 8 16 Q13 24 12 42Z" fill="#0c4a6e"/>
    <path d="M60 80 Q62 56 64 42 Q66 28 56 16 Q51 24 52 42Z" fill="#0c4a6e"/>
    <!-- Head -->
    <circle cx="32" cy="22" r="18" fill="#0ea5e9"/>
    <!-- Horns -->
    <polygon points="22,8 17,0 26,6" fill="#0c4a6e"/>
    <polygon points="42,8 47,0 38,6" fill="#0c4a6e"/>
    <!-- Eyes -->
    <ellipse cx="23" cy="18" rx="6" ry="6.5" fill="#fbbf24"/>
    <ellipse cx="41" cy="18" rx="6" ry="6.5" fill="#fbbf24"/>
    <ellipse cx="23" cy="19" rx="3.2" ry="4.5" fill="#0c2a3e"/>
    <ellipse cx="41" cy="19" rx="3.2" ry="4.5" fill="#0c2a3e"/>
    <circle cx="24.5" cy="17" r="1.3" fill="rgba(100,220,255,0.5)"/>
    <circle cx="42.5" cy="17" r="1.3" fill="rgba(100,220,255,0.5)"/>
    <!-- Scale note symbol on chest -->
    <circle cx="32" cy="52" r="8" fill="rgba(20,184,166,0.12)" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="27" y="57" font-size="9" fill="#67e8f9" opacity="0.9" font-family="serif">♫</text>
  </g>

  <!-- Musical scale label -->
  <text x="100" y="165" font-size="10" fill="#14b8a6" opacity="0.85" text-anchor="middle"
    font-family="monospace" font-weight="700" letter-spacing="2" filter="url(#glow-t)">SCALE BOSS BATTLE</text>

  <!-- Glow ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(20,184,166,0.12)" stroke-width="6"/>
</svg>
