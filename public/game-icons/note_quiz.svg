<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="14" fill="#1a2540"/>
  <!-- Staff lines -->
  <line x1="12" y1="30" x2="88" y2="30" stroke="#4A5568" stroke-width="1.8"/>
  <line x1="12" y1="39" x2="88" y2="39" stroke="#4A5568" stroke-width="1.8"/>
  <line x1="12" y1="48" x2="88" y2="48" stroke="#4A5568" stroke-width="1.8"/>
  <line x1="12" y1="57" x2="88" y2="57" stroke="#4A5568" stroke-width="1.8"/>
  <line x1="12" y1="66" x2="88" y2="66" stroke="#4A5568" stroke-width="1.8"/>
  <!-- Treble clef hint -->
  <text x="16" y="67" font-family="serif" font-size="42" fill="#00D4FF" opacity="0.7">𝄞</text>
  <!-- Note head (pink) -->
  <ellipse cx="62" cy="48" rx="9" ry="6.5" transform="rotate(-10 62 48)" fill="#ec4899"/>
  <!-- Checkmark (green) -->
  <polyline points="52,72 60,82 80,58" stroke="#39D98A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
