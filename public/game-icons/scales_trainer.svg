<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2">
  <!-- Musical staff lines -->
  <line x1="20" y1="50" x2="180" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <line x1="20" y1="65" x2="180" y2="65" stroke="currentColor" stroke-width="1.5"/>
  <line x1="20" y1="80" x2="180" y2="80" stroke="currentColor" stroke-width="1.5"/>
  <line x1="20" y1="95" x2="180" y2="95" stroke="currentColor" stroke-width="1.5"/>
  <line x1="20" y1="110" x2="180" y2="110" stroke="currentColor" stroke-width="1.5"/>

  <!-- Ascending notes with circles -->
  <circle cx="35" cy="105" r="4" fill="currentColor"/>
  <circle cx="55" cy="90" r="4" fill="currentColor"/>
  <circle cx="75" cy="75" r="4" fill="currentColor"/>
  <circle cx="95" cy="60" r="4" fill="currentColor"/>
  <circle cx="115" cy="75" r="4" fill="currentColor"/>
  <circle cx="135" cy="90" r="4" fill="currentColor"/>
  <circle cx="155" cy="105" r="4" fill="currentColor"/>

  <!-- Piano keyboard at bottom -->
  <g opacity="0.7">
    <rect x="25" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="42" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="59" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="76" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="93" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="110" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="127" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="144" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>
    <rect x="161" y="140" width="12" height="35" fill="white" stroke="currentColor" stroke-width="1"/>

    <!-- Black keys -->
    <rect x="36" y="140" width="8" height="22" fill="currentColor"/>
    <rect x="53" y="140" width="8" height="22" fill="currentColor"/>
    <rect x="87" y="140" width="8" height="22" fill="currentColor"/>
    <rect x="104" y="140" width="8" height="22" fill="currentColor"/>
    <rect x="138" y="140" width="8" height="22" fill="currentColor"/>
    <rect x="155" y="140" width="8" height="22" fill="currentColor"/>
  </g>
</svg>
