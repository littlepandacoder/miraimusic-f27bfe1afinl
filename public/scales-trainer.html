<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scales & Arpeggios Trainer — Musicable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
:root {
  --bg: #0a0812;
  --card: #151228;
  --ink: #e8ecf0;
  --sub: #a89bb5;
  --line: #2d2540;
  --rh: #00d4ff;
  --lh: #ff2d78;
  --accent: #5a45c4;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }

.container { display: flex; flex-direction: column; height: 100vh; }

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 8, 18, 0.95);
  backdrop-filter: blur(10px);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  font-weight: 700;
}

.header-left .icon {
  font-size: 20px;
}

.title {
  background: linear-gradient(135deg, var(--rh), var(--lh));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-right {
  display: flex;
  gap: 12px;
  align-items: center;
}

.btn-small {
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--sub);
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
}

.btn-small:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: #6d55d4;
}

/* Main Content */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 280px;
  background: var(--card);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 20px;
}

.sidebar-section {
  margin-bottom: 24px;
}

.sidebar-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--sub);
  margin-bottom: 12px;
}

.scale-item {
  padding: 10px 12px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--sub);
  cursor: pointer;
  font-size: 13px;
  text-align: left;
  margin-bottom: 8px;
  transition: all 0.2s;
}

.scale-item:hover {
  border-color: var(--accent);
  color: var(--ink);
}

.scale-item.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.scale-item-name {
  font-weight: 600;
  display: block;
}

.scale-item-grade {
  font-size: 10px;
  opacity: 0.7;
}

/* Piano Area */
.piano-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px;
  overflow: auto;
}

.piano-info {
  margin-bottom: 20px;
}

.info-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 4px;
}

.info-desc {
  color: var(--sub);
  font-size: 13px;
}

.info-tags {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.tag {
  padding: 4px 10px;
  background: rgba(90, 69, 196, 0.15);
  border: 1px solid rgba(90, 69, 196, 0.3);
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--rh);
}

.piano-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.piano-canvas-wrapper {
  background: linear-gradient(135deg, rgba(10, 8, 18, 0.8), rgba(21, 18, 40, 0.8));
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
  max-height: 300px;
}

canvas {
  max-width: 100%;
  max-height: 100%;
  border-radius: 8px;
}

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.btn-play {
  padding: 10px 20px;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  color: white;
  font-weight: 600;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}

.btn-play:hover {
  background: #6d55d4;
}

.tempo-control {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--sub);
}

.tempo-control input {
  width: 100px;
  cursor: pointer;
  accent-color: var(--accent);
}

.hand-info {
  display: flex;
  gap: 20px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.hand-column {
  flex: 1;
}

.hand-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--sub);
  margin-bottom: 8px;
}

.notes-list {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.note-badge {
  padding: 6px 10px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
}

.note-badge.rh {
  border-color: var(--rh);
  color: var(--rh);
}

.note-badge.lh {
  border-color: var(--lh);
  color: var(--lh);
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--sub);
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <span class="icon">🎹</span>
      <span class="title">Scales & Arpeggios Trainer</span>
    </div>
    <div class="header-right">
      <button class="btn-small" onclick="window.location.href='/dashboard'">← Dashboard</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section" id="gradesSection"></div>
      <div class="sidebar-section" id="scalesSection"></div>
    </div>

    <!-- Piano Area -->
    <div class="piano-area">
      <div class="piano-info">
        <div class="info-title" id="scaleTitle"></div>
        <div class="info-desc" id="scaleDesc"></div>
        <div class="info-tags" id="scaleTags"></div>
      </div>

      <div class="piano-container">
        <div class="piano-canvas-wrapper">
          <canvas id="pianoCanvas"></canvas>
        </div>

        <div class="controls">
          <button class="btn-play" onclick="playScale()">▶ Play</button>
          <button class="btn-small btn-primary" onclick="resetScale()">Reset</button>
          <div class="tempo-control">
            <label>Tempo</label>
            <input type="range" id="tempoSlider" min="200" max="900" value="450" step="50">
          </div>
        </div>

        <div class="hand-info">
          <div class="hand-column">
            <div class="hand-label">Right Hand</div>
            <div class="notes-list" id="rhNotes"></div>
          </div>
          <div class="hand-column">
            <div class="hand-label">Left Hand</div>
            <div class="notes-list" id="lhNotes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SCALES = [
  // Grade 1
  { id: "c-major-1", grade: 1, title: "C Major", desc: "White keys only. Smooth hand position.", dyn: "p", art: "legato", rh: [{n:"C",m:60,f:1},{n:"D",m:62,f:2},{n:"E",m:64,f:3},{n:"F",m:65,f:1},{n:"G",m:67,f:2},{n:"A",m:69,f:3},{n:"B",m:71,f:4},{n:"C",m:72,f:5}], lh: [{n:"C",m:48,f:5},{n:"D",m:50,f:4},{n:"E",m:52,f:3},{n:"F",m:53,f:2},{n:"G",m:55,f:1},{n:"A",m:57,f:3},{n:"B",m:59,f:2},{n:"C",m:60,f:1}] },
  { id: "g-major-1", grade: 1, title: "G Major", desc: "One sharp. F# position.", dyn: "f", art: "staccato", rh: [{n:"G",m:67,f:1},{n:"A",m:69,f:2},{n:"B",m:71,f:3},{n:"C",m:72,f:1},{n:"D",m:74,f:2},{n:"E",m:76,f:3},{n:"F#",m:78,f:4},{n:"G",m:79,f:5}], lh: [{n:"G",m:55,f:5},{n:"A",m:57,f:4},{n:"B",m:59,f:3},{n:"C",m:60,f:2},{n:"D",m:62,f:1},{n:"E",m:64,f:3},{n:"F#",m:66,f:2},{n:"G",m:67,f:1}] },
  { id: "f-major-1", grade: 1, title: "F Major", desc: "One flat. Bb position.", dyn: "p", art: "legato", rh: [{n:"F",m:65,f:1},{n:"G",m:67,f:2},{n:"A",m:69,f:3},{n:"Bb",m:70,f:4},{n:"C",m:72,f:5},{n:"D",m:74,f:1},{n:"E",m:76,f:2},{n:"F",m:77,f:3}], lh: [{n:"F",m:53,f:5},{n:"G",m:55,f:4},{n:"A",m:57,f:3},{n:"Bb",m:58,f:2},{n:"C",m:60,f:1},{n:"D",m:62,f:4},{n:"E",m:64,f:3},{n:"F",m:65,f:2}] },

  // Grade 2
  { id: "d-major-2", grade: 2, title: "D Major", desc: "Two sharps. F# and C# pattern.", dyn: "f", art: "staccato", rh: [{n:"D",m:62,f:1},{n:"E",m:64,f:2},{n:"F#",m:66,f:3},{n:"G",m:67,f:1},{n:"A",m:69,f:2},{n:"B",m:71,f:3},{n:"C#",m:73,f:4},{n:"D",m:74,f:5}], lh: [{n:"D",m:50,f:5},{n:"E",m:52,f:4},{n:"F#",m:54,f:3},{n:"G",m:55,f:2},{n:"A",m:57,f:1},{n:"B",m:59,f:3},{n:"C#",m:61,f:2},{n:"D",m:62,f:1}] },
  { id: "bb-major-2", grade: 2, title: "Bb Major", desc: "Two flats. Bb and Eb.", dyn: "p", art: "legato", rh: [{n:"Bb",m:70,f:2},{n:"C",m:72,f:3},{n:"D",m:74,f:1},{n:"Eb",m:75,f:2},{n:"F",m:77,f:3},{n:"G",m:79,f:4},{n:"A",m:81,f:5},{n:"Bb",m:82,f:1}], lh: [{n:"Bb",m:58,f:4},{n:"C",m:60,f:3},{n:"D",m:62,f:2},{n:"Eb",m:63,f:1},{n:"F",m:65,f:4},{n:"G",m:67,f:3},{n:"A",m:69,f:2},{n:"Bb",m:70,f:1}] },
  { id: "a-minor-2", grade: 2, title: "A Natural Minor", desc: "Relative minor of C major.", dyn: "f", art: "legato", rh: [{n:"A",m:69,f:1},{n:"B",m:71,f:2},{n:"C",m:72,f:3},{n:"D",m:74,f:1},{n:"E",m:76,f:2},{n:"F",m:77,f:3},{n:"G",m:79,f:4},{n:"A",m:81,f:5}], lh: [{n:"A",m:57,f:5},{n:"B",m:59,f:4},{n:"C",m:60,f:3},{n:"D",m:62,f:2},{n:"E",m:64,f:1},{n:"F",m:65,f:3},{n:"G",m:67,f:2},{n:"A",m:69,f:1}] },

  // Grade 3
  { id: "a-major-3", grade: 3, title: "A Major", desc: "Three sharps. F#, C#, G#.", dyn: "f", art: "staccato", rh: [{n:"A",m:69,f:1},{n:"B",m:71,f:2},{n:"C#",m:73,f:3},{n:"D",m:74,f:1},{n:"E",m:76,f:2},{n:"F#",m:78,f:3},{n:"G#",m:80,f:4},{n:"A",m:81,f:5}], lh: [{n:"A",m:57,f:5},{n:"B",m:59,f:4},{n:"C#",m:61,f:3},{n:"D",m:62,f:2},{n:"E",m:64,f:1},{n:"F#",m:66,f:3},{n:"G#",m:68,f:2},{n:"A",m:69,f:1}] },
  { id: "eb-major-3", grade: 3, title: "Eb Major", desc: "Three flats. Bb, Eb, Ab.", dyn: "p", art: "legato", rh: [{n:"Eb",m:75,f:1},{n:"F",m:77,f:2},{n:"G",m:79,f:3},{n:"Ab",m:80,f:1},{n:"Bb",m:82,f:2},{n:"C",m:84,f:3},{n:"D",m:86,f:4},{n:"Eb",m:87,f:5}], lh: [{n:"Eb",m:63,f:5},{n:"F",m:65,f:4},{n:"G",m:67,f:3},{n:"Ab",m:68,f:2},{n:"Bb",m:70,f:1},{n:"C",m:72,f:3},{n:"D",m:74,f:2},{n:"Eb",m:75,f:1}] },
];

let currentGrade = 1;
let selectedScale = SCALES[0];
let audioCtx = null;
let playing = false;

function init() {
  renderGrades();
  renderScales();
  selectScale(SCALES[0]);
}

function renderGrades() {
  const grades = [1, 2, 3];
  const html = grades.map(g => `<button class="scale-item ${currentGrade === g ? 'active' : ''}" onclick="selectGrade(${g})"><span class="scale-item-name">Grade ${g}</span></button>`).join('');
  document.getElementById('gradesSection').innerHTML = `<div class="sidebar-title">Grades</div>${html}`;
}

function renderScales() {
  const scales = SCALES.filter(s => s.grade === currentGrade);
  const html = scales.map(s => `<button class="scale-item ${selectedScale.id === s.id ? 'active' : ''}" onclick="selectScale(SCALES.find(x=>x.id==='${s.id}'))"><span class="scale-item-name">${s.title}</span><span class="scale-item-grade">Grade ${s.grade}</span></button>`).join('');
  document.getElementById('scalesSection').innerHTML = `<div class="sidebar-title">Scales</div>${html}`;
}

function selectGrade(grade) {
  currentGrade = grade;
  selectedScale = SCALES.find(s => s.grade === grade);
  renderGrades();
  renderScales();
  selectScale(selectedScale);
}

function selectScale(scale) {
  selectedScale = scale;
  document.getElementById('scaleTitle').textContent = scale.title;
  document.getElementById('scaleDesc').textContent = scale.desc;
  document.getElementById('scaleTags').innerHTML = `<span class="tag">${scale.dyn}</span><span class="tag">${scale.art}</span><span class="tag">Hands Together</span>`;

  document.getElementById('rhNotes').innerHTML = scale.rh.map(n => `<span class="note-badge rh">${n.n}</span>`).join('');
  document.getElementById('lhNotes').innerHTML = scale.lh.map(n => `<span class="note-badge lh">${n.n}</span>`).join('');

  const canvas = document.getElementById('pianoCanvas');
  canvas.width = 1200;
  canvas.height = 200;
  const ctx = canvas.getContext('2d');
  drawPiano(ctx, scale);
  renderGrades();
  renderScales();
}

function drawPiano(ctx, scale) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.fillStyle = '#0a0812';
  ctx.fillRect(0, 0, W, H);

  const lo = 48, hi = 84;
  let whiteCount = 0;
  for (let m = lo; m <= hi; m++) if (![1,3,6,8,10].includes(m%12)) whiteCount++;

  const wkW = W / whiteCount, wkH = H * 0.8;
  const bkW = wkW * 0.6, bkH = H * 0.5;

  const rhMap = {}, lhMap = {};
  scale.rh.forEach(n => rhMap[n.m] = n);
  scale.lh.forEach(n => lhMap[n.m] = n);

  // Draw white keys
  let wi = 0;
  for (let m = lo; m <= hi; m++) {
    if ([1,3,6,8,10].includes(m%12)) continue;
    const x = wi * wkW;

    let fill = '#f5f2ec', stroke = '#8b7c5c';
    if (rhMap[m]) { fill = 'rgba(0,212,255,0.3)'; stroke = '#00d4ff'; }
    if (lhMap[m]) { fill = rhMap[m] ? 'rgba(155,124,232,0.3)' : 'rgba(255,45,120,0.3)'; stroke = '#ff2d78'; }

    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.fillRect(x + 1, 1, wkW - 2, wkH);
    ctx.strokeRect(x + 1, 1, wkW - 2, wkH);

    const noteNum = m % 12;
    const octave = Math.floor(m / 12) - 1;
    const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const noteName = noteNames[noteNum];

    ctx.fillStyle = '#6b7280';
    ctx.font = '11px -apple-system';
    ctx.textAlign = 'center';
    ctx.fillText(noteName + octave, x + wkW / 2, wkH + 20);

    if (rhMap[m]) {
      ctx.fillStyle = '#00d4ff';
      ctx.beginPath();
      ctx.arc(x + wkW / 2, wkH - 20, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0a0812';
      ctx.font = 'bold 9px -apple-system';
      ctx.fillText(rhMap[m].f, x + wkW / 2, wkH - 17);
    }
    if (lhMap[m]) {
      ctx.fillStyle = '#ff2d78';
      ctx.beginPath();
      ctx.arc(x + wkW / 2, wkH - 8, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 9px -apple-system';
      ctx.fillText(lhMap[m].f, x + wkW / 2, wkH - 5);
    }

    wi++;
  }

  // Draw black keys
  wi = 0;
  const blackFrac = { 1: 0.68, 3: 1.72, 6: 3.65, 8: 4.63, 10: 5.65 };
  for (let m = lo; m < hi; m++) {
    if (![1,3,6,8,10].includes(m%12)) continue;
    const oct = Math.floor(m / 12);
    const semis = m % 12;
    let wCountBeforeOctave = 0;
    for (let mm = lo; mm < oct * 12; mm++) if (![1,3,6,8,10].includes(mm%12)) wCountBeforeOctave++;
    const x = (wCountBeforeOctave + blackFrac[semis]) * wkW - bkW / 2;

    let fill = '#1a1620';
    if (rhMap[m] && lhMap[m]) fill = '#9d7ce8';
    else if (rhMap[m]) fill = '#00d4ff';
    else if (lhMap[m]) fill = '#ff2d78';

    ctx.fillStyle = fill;
    ctx.fillRect(x, 1, bkW, bkH);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, 1, bkW, bkH);
  }
}

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function playTone(freq, dur, gain) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(gain, now + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur / 1000);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur / 1000 + 0.02);
}

function playScale() {
  if (playing) { resetScale(); return; }
  playing = true;
  const step = Number(document.getElementById('tempoSlider').value);
  const gain = selectedScale.dyn === 'f' ? 0.22 : 0.09;
  const dur = selectedScale.art === 'staccato' ? step * 0.4 : step * 0.95;

  const notes = selectedScale.rh.map((n, i) => ({ rh: n, lh: selectedScale.lh[i] }));
  let i = 0;

  const play = () => {
    if (i >= notes.length) { playing = false; return; }
    playTone(midiToFreq(notes[i].rh.m), dur, gain);
    playTone(midiToFreq(notes[i].lh.m), dur, gain * 0.9);
    i++;
    setTimeout(play, step);
  };
  play();
}

function resetScale() {
  playing = false;
  selectScale(selectedScale);
}

init();
</script>

</body>
</html>
