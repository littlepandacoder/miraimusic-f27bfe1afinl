<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scales & Arpeggios Trainer — Musicable</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #f5f5f5;
    color: #1d1d1b;
    padding: 24px 20px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .header {
    margin-bottom: 24px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .subtitle {
    color: #6b7280;
    font-size: 14px;
  }

  /* Grade selector */
  .grade-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .grade-btn {
    padding: 8px 16px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .grade-btn:hover {
    border-color: #5a45c4;
    background: #f0edff;
  }

  .grade-btn.active {
    background: #5a45c4;
    border-color: #5a45c4;
    color: white;
  }

  /* Tabs */
  .tabs-wrapper {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    border: 1px solid #e5e7eb;
    overflow-x: auto;
  }

  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 10px 16px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #1d1d1b;
    transition: all 0.2s;
    text-align: center;
    white-space: nowrap;
  }

  .tab:hover {
    border-color: #5a45c4;
    background: #f0edff;
  }

  .tab.active {
    background: #5a45c4;
    border-color: #5a45c4;
    color: white;
  }

  .tab-label {
    font-size: 11px;
    color: #6b7280;
    display: block;
  }

  .tab-name {
    display: block;
    font-weight: 700;
  }

  /* Main content */
  .content {
    background: white;
    border-radius: 12px;
    padding: 32px;
    border: 1px solid #e5e7eb;
  }

  .content-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .content-left {
    flex: 1;
  }

  .content-title {
    font-size: 24px;
    font-weight: 700;
  }

  .content-desc {
    color: #6b7280;
    font-size: 14px;
    margin-top: 4px;
  }

  .badges {
    display: flex;
    gap: 8px;
  }

  .badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid #e5e7eb;
  }

  .badge-dyn { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
  .badge-art { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
  .badge-hand { background: #f3f4f6; color: #374151; border-color: #d1d5db; }

  /* Piano keyboard */
  .keyboard-display {
    margin: 24px 0;
    overflow-x: auto;
    padding-bottom: 12px;
  }

  svg {
    display: block;
    margin: 0 auto;
  }

  .legend {
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 24px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  button {
    padding: 10px 20px;
    border: 1px solid #d1d5db;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  button:hover {
    border-color: #5a45c4;
    color: #5a45c4;
  }

  .btn-primary {
    background: #5a45c4;
    border-color: #5a45c4;
    color: white;
  }

  .btn-primary:hover {
    background: #4a36a4;
    border-color: #4a36a4;
    color: white;
  }

  .tempo-control {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: #6b7280;
  }

  .tempo-control input {
    width: 120px;
    cursor: pointer;
  }

  /* Hand blocks */
  .hand-block {
    margin-bottom: 24px;
  }

  .hand-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b7280;
    margin-bottom: 12px;
  }

  .note-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .note-card {
    padding: 12px 16px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    text-align: center;
    min-width: 60px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .note-card:hover {
    border-color: #5a45c4;
  }

  .note-card.current {
    border-color: #5a45c4;
    background: #f0edff;
  }

  .note-name {
    font-weight: 700;
    font-size: 14px;
    display: block;
  }

  .note-finger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    color: white;
    font-size: 12px;
    font-weight: 700;
    margin-top: 6px;
  }

  .note-card.rh .note-finger { background: #3b82f6; }
  .note-card.lh .note-finger { background: #f97316; }

  /* Notes */
  .note-text {
    font-size: 13px;
    color: #6b7280;
    margin-top: 20px;
    line-height: 1.6;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
  }

  .hidden {
    display: none;
  }
</style>
</head>

  <div class="tabs-wrapper">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="content" id="content"></div>
</div>

    ],

let currentGrade = 1;
let selectedId = SCALES_DATA[0].id;
let audioCtx = null;

function initGradeSelector() {
  const grades = [1, 2, 3, 4, 5, 6];
  const selector = document.getElementById('gradeSelector');
  selector.innerHTML = grades.map(g =>
    `<button class="grade-btn ${g === currentGrade ? 'active' : ''}" onclick="selectGrade(${g})">Grade ${g}</button>`
  ).join('');
}

function selectGrade(grade) {
  currentGrade = grade;
  document.querySelectorAll('.grade-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderTabs();
}

function getScalesByGrade() {
  return SCALES_DATA.filter(s => s.grade === currentGrade);
}

function renderTabs() {
  const scales = getScalesByGrade();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = scales.map(s => `
    <button class="tab ${s.id === selectedId ? 'active' : ''}" onclick="selectScale('${s.id}')">
      <span class="tab-label">${s.type}</span>
      <span class="tab-name">${s.title}</span>
    </button>
  `).join('');
  renderContent();
}

function selectScale(id) {
  selectedId = id;
  renderTabs();
}

function renderContent() {
  const scale = SCALES_DATA.find(s => s.id === selectedId);
  if (!scale) return;

  const content = document.getElementById('content');
  const handLabel = scale.hands === 'contrary' ? 'Contrary motion' : 'Hands together';

  content.innerHTML = `
    <div class="content-header">
      <div class="content-left">
        <div class="content-title">${scale.title}</div>
        <div class="content-desc">${scale.desc}</div>
      </div>
      <div class="badges">
        <span class="badge badge-dyn">${scale.dyn}</span>
        <span class="badge badge-art">${scale.art}</span>
        <span class="badge badge-hand">${handLabel}</span>
      </div>
    </div>

    <div class="keyboard-display" id="kbwrap"></div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background: #3b82f6;"></div>
        <span>Right hand</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: #f97316;"></div>
        <span>Left hand</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-primary" onclick="playScale()">▶ Play</button>
      <button onclick="resetPlayback()">Reset</button>
      <div class="tempo-control">
        <label>Tempo</label>
        <input type="range" id="tempoSlider" min="200" max="900" value="450" step="50" style="width:110px;">
      </div>
    </div>

    <div class="hand-block">
      <div class="hand-label">Right hand</div>
      <div class="note-row" id="rhRow"></div>
    </div>

    <div class="hand-block">
      <div class="hand-label">Left hand</div>
      <div class="note-row" id="lhRow"></div>
    </div>

    <div class="note-text">${scale.knots}</div>
  `;

  drawKeyboard(scale.rh, scale.lh);
  refreshNoteRows(scale, -1);
}

function drawKeyboard(rhNotes, lhNotes) {
  const lo = 48, hi = 84;
  const wkW = 32, wkH = 120, bkW = 19, bkH = 76;

  let whiteCount = 0;
  for (let m = lo; m <= hi; m++) {
    if (![1,3,6,8,10].includes(m % 12)) whiteCount++;
  }

  const rhMap = {}, lhMap = {};
  rhNotes.forEach(n => rhMap[n.midi] = n.finger);
  lhNotes.forEach(n => lhMap[n.midi] = n.finger);

  const width = whiteCount * wkW + 2;
  let svg = `<svg viewBox="0 0 ${width} ${wkH+4}" width="${Math.min(width, 880)}" height="${wkH+4}">`;

  let wi = 0, whiteRects = '', blackRects = '', labels = '';

  for (let m = lo; m <= hi; m++) {
    if ([1,3,6,8,10].includes(m % 12)) continue;
    const x = wi * wkW + 1;
    let fill = '#fff', stroke = '#c9c7bf';
    if (rhMap[m]) { fill = '#dbe9fd'; stroke = '#0c447c'; }
    if (lhMap[m]) { fill = rhMap[m] ? '#e9dcf6' : '#fbe1d3'; stroke = '#4a1b0c'; }

    whiteRects += `<rect x="${x}" y="1" width="${wkW-2}" height="${wkH}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;

    if (rhMap[m]) {
      labels += `<circle cx="${x+wkW/2-1}" cy="${wkH-24}" r="9" fill="#2f6fed"/><text x="${x+wkW/2-1}" y="${wkH-20}" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">${rhMap[m]}</text>`;
    }
    if (lhMap[m]) {
      labels += `<circle cx="${x+wkW/2-1}" cy="${wkH-42}" r="9" fill="#d85a30"/><text x="${x+wkW/2-1}" y="${wkH-38}" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">${lhMap[m]}</text>`;
    }
    wi++;
  }

  for (let m = lo; m < hi; m++) {
    if (![1,3,6,8,10].includes(m % 12)) continue;
    const oct = Math.floor(m / 12);
    const semis = m % 12;
    const whiteOffsets = {0:0,2:1,4:2,5:3,7:4,9:5,11:6};
    const blackFrac = {1:0.68,3:1.72,6:3.65,8:4.63,10:5.65};

    let wCountBeforeOctave = 0;
    for (let mm = lo; mm < oct * 12; mm++) {
      if (![1,3,6,8,10].includes(mm % 12)) wCountBeforeOctave++;
    }

    const x = 1 + (wCountBeforeOctave + blackFrac[semis]) * wkW - bkW / 2;
    let fill = '#2b2b29';
    if (rhMap[m] && lhMap[m]) fill = '#6a4fae';
    else if (rhMap[m]) fill = '#2f6fed';
    else if (lhMap[m]) fill = '#d85a30';

    blackRects += `<rect x="${x}" y="1" width="${bkW}" height="${bkH}" rx="2" fill="${fill}"/>`;
  }

  svg += whiteRects + blackRects + labels + '</svg>';
  document.getElementById('kbwrap').innerHTML = svg;
}

function refreshNoteRows(scale, currentIdx) {
  document.getElementById('rhRow').innerHTML = scale.rh.map((n, i) =>
    `<div class="note-card rh ${i === currentIdx ? 'current' : ''}">
      <span class="note-name">${n.name}</span>
      <span class="note-finger">${n.finger}</span>
    </div>`
  ).join('');

  document.getElementById('lhRow').innerHTML = scale.lh.map((n, i) =>
    `<div class="note-card lh ${i === currentIdx ? 'current' : ''}">
      <span class="note-name">${n.name}</span>
      <span class="note-finger">${n.finger}</span>
    </div>`
  ).join('');
}

function midiToFreq(m) {
  return 440 * Math.pow(2, (m - 69) / 12);
}

function playTone(freq, durMs, gainLevel) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.frequency.value = freq;
  osc.type = 'sine';
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(gainLevel, now + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + durMs / 1000);

  osc.start(now);
  osc.stop(now + durMs / 1000 + 0.02);
}

function playScale() {
  const scale = SCALES_DATA.find(s => s.id === selectedId);
  if (!scale) return;

  const stepMs = Number(document.getElementById('tempoSlider').value);
  const gainLevel = scale.dyn === 'f' ? 0.22 : 0.09;
  const durMs = scale.art === 'staccato' ? stepMs * 0.4 : stepMs * 0.95;

  const full = scale.rh.map((n, i) => ({rh: n, lh: scale.lh[i]}));
  let i = 0;

  function step() {
    if (i >= full.length) { resetPlayback(); return; }
    const pair = full[i];
    playTone(midiToFreq(pair.rh.midi), durMs, gainLevel);
    playTone(midiToFreq(pair.lh.midi), durMs, gainLevel * 0.9);
    refreshNoteRows(scale, i);
    i++;
    setTimeout(step, stepMs);
  }

  step();
}

function resetPlayback() {
  const scale = SCALES_DATA.find(s => s.id === selectedId);
  if (scale) refreshNoteRows(scale, -1);
}

// Initialize
