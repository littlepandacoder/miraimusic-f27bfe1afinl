    <!-- Inline unload blocker: runs early to prevent Permissions Policy spam -->
    <script>
      (function(){
        try {
          var origAdd = EventTarget.prototype.addEventListener;
          var diagnostics = false;
          try { diagnostics = localStorage.getItem('unload-blocker:diagnostics') === '1'; } catch(e) {}

          // Create a small diagnostics banner element (hidden by default)
          var bannerId = 'unload-blocker-banner';
          function ensureBanner() {
            if (document.getElementById(bannerId)) return document.getElementById(bannerId);
            try {
              var el = document.createElement('div');
              el.id = bannerId;
              el.style.position = 'fixed';
              el.style.right = '12px';
              el.style.bottom = '12px';
              el.style.zIndex = '99999';
              el.style.background = 'rgba(255,69,58,0.95)';
              el.style.color = 'white';
              el.style.padding = '8px 12px';
              el.style.borderRadius = '6px';
              el.style.fontSize = '12px';
              el.style.fontFamily = 'sans-serif';
              el.style.boxShadow = '0 4px 14px rgba(0,0,0,0.2)';
              el.style.display = 'none';
              el.style.maxWidth = '320px';
              el.style.wordBreak = 'break-word';
              el.innerHTML = '<strong>Diagnostics:</strong> <span id="unload-blocker-origin">(none)</span> <button id="unload-blocker-close" style="margin-left:8px;background:transparent;border:0;color:rgba(255,255,255,0.9);cursor:pointer;font-weight:600">✕</button>';
              document.documentElement.appendChild(el);
              var btn = document.getElementById('unload-blocker-close');
              btn && btn.addEventListener('click', function(){ try{ el.style.display='none'; }catch(e){} });
              return el;
            } catch (e) {
              return null;
            }
          }

          function showOrigin(origin, stack) {
            try {
              var el = ensureBanner();
              if (!el) return;
              var span = document.getElementById('unload-blocker-origin');
              if (span) span.textContent = origin + ' (see console for stack)';
              el.style.display = 'block';
              // Also log stack to console to keep details available
              console.warn('[musicableapp] blocked registration of "unload" event listener. origin=' + origin, stack);
            } catch(e){ /* ignore */ }
          }

          EventTarget.prototype.addEventListener = function(type, listener, options){
            if (type === 'unload') {
              var stack = (new Error()).stack || '';
              if (diagnostics) {
                var extMatch = stack.match(/(chrome-extension|moz-extension|safari-extension):\/\/[^\s)]+/i);
                var origin = extMatch ? extMatch[0] : 'unknown';
                showOrigin(origin, stack);
              } else {
                // Keep a minimal console warning when diagnostics are off
                console.warn('[musicableapp] blocked registration of "unload" event listener.');
              }
              return;
            }
            return origAdd.call(this, type, listener, options);
          };
        } catch (err) {
          /* ignore */
        }
      })();
    </script>

    <!-- CookieHub Consent Management -->
    <script src="https://cdn.cookiehub.eu/c2/b2cf9ce5.js"></script>
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function(event) {
        // If the user already made a choice, skip the banner entirely.
        try {
          if (localStorage.getItem('cookieConsent')) return;
        } catch(e) {}

        var cpm = {
          onAllow: function() {
            try { localStorage.setItem('cookieConsent', 'accepted'); } catch(e) {}
          },
          onDecline: function() {
            try { localStorage.setItem('cookieConsent', 'declined'); } catch(e) {}
          }
        };
        window.cookiehub.load(cpm);
      });
    </script>

    <!-- Custom cursor for cookie consent — sits above CookieHub overlay -->
    <div id="cch-cur" aria-hidden="true"></div>
    <style>
      #cch-cur{
        position:fixed;left:-99px;top:-99px;
        width:18px;height:18px;border-radius:50%;
        background:#fff;
        pointer-events:none;
        z-index:2147483647;
        transform:translate(-50%,-50%);
        transition:background .22s,box-shadow .22s;
        opacity:0;
        box-shadow:0 0 0 2px rgba(255,255,255,.28);
      }
      .cch-on #cch-cur{opacity:1;}
      .cch-on,.cch-on *{cursor:none!important;}
    </style>
    <script>
    (function(){
      var cur=document.getElementById('cch-cur');
      var on=false;
      document.addEventListener('mousemove',function(e){
        cur.style.left=e.clientX+'px';
        cur.style.top=e.clientY+'px';
      },true);
      function activate(){
        if(on)return;on=true;
        document.documentElement.classList.add('cch-on');
      }
      function deactivate(){
        if(!on)return;on=false;
        document.documentElement.classList.remove('cch-on');
        cur.style.background='#fff';
        cur.style.boxShadow='0 0 0 2px rgba(255,255,255,.28)';
      }
      function wireBtn(btn){
        if(!btn||btn._cchWired)return;
        btn._cchWired=true;
        btn.addEventListener('mouseenter',function(){
          cur.style.background='#FF2D78';
          cur.style.boxShadow='0 0 16px rgba(255,45,120,.85)';
        });
        btn.addEventListener('mouseleave',function(){
          cur.style.background='#fff';
          cur.style.boxShadow='0 0 0 2px rgba(255,255,255,.28)';
        });
        btn.addEventListener('click',function(){
          // Flash pink then settle to white, then hide custom cursor
          cur.style.background='#FF2D78';
          cur.style.boxShadow='0 0 24px rgba(255,45,120,1)';
          setTimeout(function(){
            cur.style.background='#fff';
            cur.style.boxShadow='0 0 0 2px rgba(255,255,255,.28)';
            setTimeout(deactivate,400);
          },550);
        });
      }
      // Watch for CookieHub banner injection
      var obs=new MutationObserver(function(){
        // CookieHub uses class prefixes like ch2-
        var banner=document.querySelector('[class*="ch2-dialog"],[class*="ch2-container"],#ch2');
        if(!banner){
          // Fallback: any fixed overlay that appeared
          var nodes=document.querySelectorAll('[style*="z-index"]');
          nodes.forEach(function(n){
            if(n.style.position==='fixed'&&parseInt(n.style.zIndex)>9000)banner=n;
          });
        }
        if(banner&&!banner._cchSeen){
          banner._cchSeen=true;
          activate();
          // Wire all likely "allow" / "accept" buttons inside banner
          var btns=banner.querySelectorAll('button,a[role="button"]');
          btns.forEach(function(b){
            if(/allow|accept|agree|got it/i.test(b.textContent))wireBtn(b);
          });
          // Also wire by CookieHub class convention
          var chBtn=banner.querySelector('.ch2-allow-all,.ch2-btn-accept');
          wireBtn(chBtn);
          // Watch for banner removal
          var rmObs=new MutationObserver(function(){
            if(!document.body.contains(banner)){deactivate();rmObs.disconnect();}
          });
          rmObs.observe(document.body,{childList:true,subtree:true});
        }
      });
      obs.observe(document.body,{childList:true,subtree:true});
    })();
    </script>
